name: Fendix Action E2E
on:
  push:
    branches: ['v370-e2e/**']
  pull_request:
    branches: ['v370-e2e/base']
permissions:
  contents: read
  security-events: write    # SARIF upload
  actions: read             # SARIF upload in a private or internal repository; the log check reads the job log
  checks: read              # Test harness only: the log check reads the job's annotations
jobs:
  fendix:
    runs-on: ubuntu-latest
    # Test harness only: a runner whose glibc is older than 2.34 (Debian 11, glibc 2.31).
    container:
      image: python:3.11-bullseye@sha256:df0bd610af061603b29d63eb82027b64d5a3f15506e39270422b10b2a55079fc
    env:
      # Test harness only: in a container job setup-python would take the host's
      # cached Python, built for Ubuntu 24.04, which does not run on glibc 2.31.
      # This tool cache holds the container's own Python 3.11, as a self-hosted
      # runner of this distribution has one built for it.
      AGENT_TOOLSDIRECTORY: /opt/fendix-toolcache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0      # diff mode compares against the PR base ref
      # Test harness only: sigstore/cosign-installer needs envsubst, which this image lacks.
      - name: E2E harness install gettext-base
        run: |
          set -eu
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends gettext-base >/dev/null
          command -v envsubst
      # Test harness only: see AGENT_TOOLSDIRECTORY above.
      - name: E2E harness container Python as the setup-python tool cache
        run: |
          set -eu
          echo "E2E-PLATFORM $(uname -m) $(ldd --version 2>&1 | sed -n 1p)"
          version=$(python3 -c 'import platform; print(platform.python_version())')
          mkdir -p "$AGENT_TOOLSDIRECTORY/Python/$version"
          ln -s /usr/local "$AGENT_TOOLSDIRECTORY/Python/$version/x64"
          touch "$AGENT_TOOLSDIRECTORY/Python/$version/x64.complete"
      - id: fendix
        uses: Fendix-app/Fendix@90adf6a5082be0661b4156566a3a99609ed4792d
        continue-on-error: true   # Test harness only: the assertions below decide the job
        with:
          version: v3.7.0
          code: .
          fail-on: HIGH
          upload-sarif: 'true'
          require-analyzers: none
      # Test harness only: record the Action's outputs and the report it wrote.
      - name: E2E record outputs and report
        if: always()
        env:
          OUTCOME: ${{ steps.fendix.outcome }}
          REPORT: ${{ steps.fendix.outputs.report }}
          EXIT_CODE: ${{ steps.fendix.outputs.exit-code }}
        run: |
          echo "E2E-OUTPUTS outcome=$OUTCOME exit-code=$EXIT_CODE report=$REPORT"
          if [ -n "$REPORT" ] && [ -s "$REPORT" ]; then
            echo "E2E-REPORT $(gzip -c "$REPORT" | base64 -w0)"
          else
            echo "E2E-REPORT none"
          fi
      # Test harness only: a clean scan without Semgrep must pass with a warning, never a clean line.
      - name: E2E assert outcome and outputs
        if: always()
        env:
          OUTCOME: ${{ steps.fendix.outcome }}
          REPORT: ${{ steps.fendix.outputs.report }}
          EXIT_CODE: ${{ steps.fendix.outputs.exit-code }}
        run: |
          set -eu
          fail() { echo "::error title=E2E assertion::$1"; exit 1; }
          [ "$EXIT_CODE" = 0 ] || fail "the clean tree should scan to exit-code 0, got '$EXIT_CODE'"
          [ "$OUTCOME" = success ] || fail "exit-code 0 but the Action step outcome is '$OUTCOME'"
          [ -n "$REPORT" ] && [ -s "$REPORT" ] || fail "no report was written"
          python3 - "$REPORT" <<'PY'
          import json, sys
          run = json.load(open(sys.argv[1]))["runs"][0]
          cov = run["properties"]["fendix/coverage"]
          status = {s["name"]: s for s in cov["scanner_status"]}
          sg = status["semgrep"]
          c = cov["coverage"]
          print("E2E-COVERAGE", json.dumps(c, sort_keys=True))
          print("E2E-SEMGREP", json.dumps(sg, sort_keys=True))
          print("E2E-RAN", ",".join(n for n, s in status.items() if s["state"] == "ok"))
          for r in run["results"]:
              p = r.get("properties", {})
              print("E2E-FINDING", r["ruleId"], p.get("status"), p.get("confidence_band"), r.get("level"))
          assert run["tool"]["driver"].get("version") == "v3.7.0", run["tool"]["driver"].get("version")
          assert sg["state"] == "skipped" and sg.get("reason") == "dependency_missing", sg
          assert c["strict"] is False and c["required_analyzers"] == [], c
          assert c["configured_complete"] is False and "semgrep" in c["gaps"], c
          PY
          echo "E2E-ASSERT outcome=$OUTCOME exit-code=$EXIT_CODE: scanned without Semgrep, recorded unavailable"
  logs:
    needs: fendix
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Test harness only: a composite Action's inner steps are invisible to the
      # caller, so what the Action printed is checked in the finished job log
      # and in the job's annotations (an annotation title is not in the log).
      - name: E2E assert the Action log and annotations
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -eu
          id=$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs" --jq '.jobs[] | select(.name == "fendix") | .id')
          [ -n "$id" ] || { echo "::error title=E2E log check::no fendix job in this run"; exit 1; }
          raw=""
          for _ in $(seq 1 12); do
            if raw=$(gh api --allow-escape-sequences "repos/$REPO/actions/jobs/$id/logs" 2>/dev/null) && [ -n "$raw" ]; then break; fi
            raw=""; sleep 10
          done
          [ -n "$raw" ] || { echo "::error title=E2E log check::could not read the fendix job log"; exit 1; }
          # Lines in ANSI 36;1 are the job's own step scripts echoed, never Action
          # output. ESC arrives raw, or as the two characters ^[ when escaped.
          esc=$(printf '\033')
          log=$(printf '%s\n' "$raw" | grep -v -F -e "${esc}[36;1m" -e '^[[36;1m' | sed -e "s/${esc}\[[0-9;]*m//g" -e 's/\^\[\[[0-9;]*m//g' || true)
          ann=""
          for _ in $(seq 1 6); do
            if ann=$(gh api "repos/$REPO/check-runs/$id/annotations?per_page=100" --jq '.[] | "\(.annotation_level) :: \(.title) :: \(.message)"' 2>/dev/null) && [ -n "$ann" ]; then break; fi
            ann=""; sleep 10
          done
          echo "Annotations of job $id:"
          printf '%s\n' "$ann" | sed 's/^/  /'
          failed=0
          while IFS= read -r rule; do
            [ -n "$rule" ] || continue
            kind=${rule%%|*}; rest=${rule#*|}; ok=0
            case "$kind" in
              present) [[ $log == *"$rest"* ]] && ok=1 ;;
              absent) [[ $log == *"$rest"* ]] || ok=1 ;;
              ann) [[ $ann == *"$rest"* ]] && ok=1 ;;
              noann) [[ $ann == *"$rest"* ]] || ok=1 ;;
              within)
                start=${rest%%|*}; rest=${rest#*|}; end=${rest%%|*}; text=${rest#*|}
                if [[ $log == *"$start"* ]]; then
                  seg=${log#*"$start"}; seg=${seg%%"$end"*}
                  [[ $seg == *"$text"* ]] && ok=1
                fi ;;
            esac
            if [ "$ok" = 1 ]; then echo "E2E-RULE ok   $rule"; else echo "::error title=E2E log check::rule failed: $rule"; echo "E2E-RULE FAIL $rule"; failed=1; fi
          done <<'RULES'
          present|E2E-PLATFORM x86_64 ldd (Debian GLIBC 2.31
          present|Verified Fendix v3.7.0 at /
          present|Prepared Python source for v3.7.0 at commit 90adf6a5082be0661b4156566a3a99609ed4792d
          present|Installing the locked dependencies of Fendix v3.7.0 (requirements.lock, --require-hashes)
          present|Wheels only (--only-binary=:all:): no dependency is built from source
          absent|Building wheel for
          present|semgrep==1.182.1 has no wheel for this runner: it has glibc 2.31 on x86_64, and glibc 2.31 is older than 2.34.
          present|No requirement needs Semgrep, so it is left out
          present|No analyzer is required (require-analyzers: none)
          present|##[end-action id=fendix.prepare;outcome=success;
          present|##[end-action id=fendix.scan;outcome=success;
          present|coverage: incomplete (semgrep)
          absent|--require-analyzers
          absent|reported the probe's known match
          absent|✓ Fendix
          ann|warning :: Fendix scans without Semgrep ::
          ann|warning :: Fendix coverage not enforced ::
          present|require-analyzers is none, so required-analyzer enforcement is off
          RULES
          exit "$failed"
